<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AscendDV</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f232b" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Analytics for organizations with messy or incomplete data. AscendDV calculates only the metrics your data can support and renders only the cards it can stand behind."
    />
    <meta property="og:title" content="AscendDV" />
    <meta property="og:description" content="Only the metrics your data can support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <script>
      // Apply saved visual preferences before first paint so the theme never flashes.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("ascenddv.prefs") || "{}");
          var el = document.documentElement;
          if (p.theme === "light" || p.theme === "dark")
            el.setAttribute("data-theme", p.theme);
          if (p.density === "compact") el.setAttribute("data-density", "compact");
          if (p.reduceMotion === true)
            el.setAttribute("data-reduce-motion", "true");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
