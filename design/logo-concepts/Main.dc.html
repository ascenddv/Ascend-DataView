<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f9f9f7; color: #0b0b0b; }
    a { color: #2a78d6; } a:hover { color: #1f5fab; }
  </style>
</helmet>
<div style="width: 480px; height: 560px; box-sizing: border-box; padding: 36px; display: flex; flex-direction: column; gap: 22px; background: #f9f9f7;">

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #898781;">Concept A &middot; leading</div>
    <div style="font-size: 21px; font-weight: 600; letter-spacing: -0.02em;">Signal Steps</div>
    <div style="font-size: 13px; line-height: 1.5; color: #52514e; max-width: 42ch;">Four bars climbing left to right; the third stays an outline. The app renders only the metrics the data supports &mdash; the climb still reads even with a rung missing.</div>
  </div>

  <div style="display: flex; align-items: center; gap: 26px;">
    <div style="width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(11,11,11,0.10); border-radius: 16px; background: #fcfcfb;">
      <svg width="58" height="58" viewBox="0 0 72 72" fill="none" style="color: #0b0b0b;">
        <rect x="6" y="44" width="10" height="20" rx="3" fill="currentColor"/>
        <rect x="23" y="30" width="10" height="34" rx="3" fill="currentColor"/>
        <rect x="40" y="18" width="10" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <rect x="57" y="8" width="10" height="56" rx="3" fill="currentColor"/>
      </svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="32" height="32" viewBox="0 0 72 72" fill="none" style="color: #0b0b0b;">
        <rect x="6" y="44" width="10" height="20" rx="3" fill="currentColor"/>
        <rect x="23" y="30" width="10" height="34" rx="3" fill="currentColor"/>
        <rect x="40" y="18" width="10" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <rect x="57" y="8" width="10" height="56" rx="3" fill="currentColor"/>
      </svg>
      <span style="font-size: 25px; font-weight: 600; letter-spacing: -0.03em;">AscendDV</span>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 22px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="16" height="16" viewBox="0 0 72 72" fill="none" style="color: #0b0b0b;">
        <rect x="6" y="44" width="10" height="20" rx="3" fill="currentColor"/>
        <rect x="23" y="30" width="10" height="34" rx="3" fill="currentColor"/>
        <rect x="40" y="18" width="10" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="4"/>
        <rect x="57" y="8" width="10" height="56" rx="3" fill="currentColor"/>
      </svg>
      <span style="font-size: 10px; color: #898781;">16 px</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="24" height="24" viewBox="0 0 72 72" fill="none" style="color: #0b0b0b;">
        <rect x="6" y="44" width="10" height="20" rx="3" fill="currentColor"/>
        <rect x="23" y="30" width="10" height="34" rx="3" fill="currentColor"/>
        <rect x="40" y="18" width="10" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
        <rect x="57" y="8" width="10" height="56" rx="3" fill="currentColor"/>
      </svg>
      <span style="font-size: 10px; color: #898781;">24 px</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="32" height="32" viewBox="0 0 72 72" fill="none" style="color: #0b0b0b;">
        <rect x="6" y="44" width="10" height="20" rx="3" fill="currentColor"/>
        <rect x="23" y="30" width="10" height="34" rx="3" fill="currentColor"/>
        <rect x="40" y="18" width="10" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <rect x="57" y="8" width="10" height="56" rx="3" fill="currentColor"/>
      </svg>
      <span style="font-size: 10px; color: #898781;">32 px</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #2a78d6;">
        <svg width="24" height="24" viewBox="0 0 72 72" fill="none" style="color: #ffffff;">
          <rect x="6" y="44" width="10" height="20" rx="3" fill="currentColor"/>
          <rect x="23" y="30" width="10" height="34" rx="3" fill="currentColor"/>
          <rect x="40" y="18" width="10" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
          <rect x="57" y="8" width="10" height="56" rx="3" fill="currentColor"/>
        </svg>
      </div>
      <span style="font-size: 10px; color: #898781;">app tile</span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; background: #0d0d0d; border-radius: 12px; padding: 18px 20px;">
    <svg width="28" height="28" viewBox="0 0 72 72" fill="none" style="color: #ffffff;">
      <rect x="6" y="44" width="10" height="20" rx="3" fill="currentColor"/>
      <rect x="23" y="30" width="10" height="34" rx="3" fill="currentColor"/>
      <rect x="40" y="18" width="10" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <rect x="57" y="8" width="10" height="56" rx="3" fill="currentColor"/>
    </svg>
    <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.03em; color: #ffffff;">AscendDV</span>
    <span style="margin-left: auto; font-size: 11px; color: #898781;">on dark</span>
  </div>

</div>
</x-dc>
</body>
</html>
