<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f9f9f7; color: #0b0b0b; }
    a { color: #2a78d6; } a:hover { color: #1f5fab; }
  </style>
</helmet>
<div style="width: 480px; height: 560px; box-sizing: border-box; padding: 36px; display: flex; flex-direction: column; gap: 22px; background: #f9f9f7;">

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #898781;">Concept B</div>
    <div style="font-size: 21px; font-weight: 600; letter-spacing: -0.02em;">Ascent</div>
    <div style="font-size: 13px; line-height: 1.5; color: #52514e; max-width: 42ch;">A rising chevron for the &ldquo;Ascend&rdquo; in the name. The faint chevron above is headroom &mdash; the level not yet reached &mdash; not a missing piece.</div>
  </div>

  <div style="display: flex; align-items: center; gap: 26px;">
    <div style="width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(11,11,11,0.10); border-radius: 16px; background: #fcfcfb;">
      <svg width="58" height="58" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="color: #0b0b0b;">
        <path d="M12 48 L36 24 L60 48"/>
        <path d="M22 20 L36 8 L50 20" stroke-width="7" opacity="0.32"/>
      </svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="30" height="30" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="color: #0b0b0b;">
        <path d="M12 48 L36 24 L60 48"/>
        <path d="M22 20 L36 8 L50 20" stroke-width="7" opacity="0.32"/>
      </svg>
      <span style="font-size: 25px; font-weight: 600; letter-spacing: -0.03em;">AscendDV</span>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 22px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="16" height="16" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" style="color: #0b0b0b;">
        <path d="M14 46 L36 24 L58 46"/>
      </svg>
      <span style="font-size: 10px; color: #898781;">16 px</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="24" height="24" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" style="color: #0b0b0b;">
        <path d="M13 47 L36 24 L59 47"/>
        <path d="M24 19 L36 9 L48 19" stroke-width="8" opacity="0.32"/>
      </svg>
      <span style="font-size: 10px; color: #898781;">24 px</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="32" height="32" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="color: #0b0b0b;">
        <path d="M12 48 L36 24 L60 48"/>
        <path d="M22 20 L36 8 L50 20" stroke-width="7" opacity="0.32"/>
      </svg>
      <span style="font-size: 10px; color: #898781;">32 px</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #2a78d6;">
        <svg width="24" height="24" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" style="color: #ffffff;">
          <path d="M13 47 L36 24 L59 47"/>
          <path d="M24 19 L36 9 L48 19" stroke-width="8" opacity="0.4"/>
        </svg>
      </div>
      <span style="font-size: 10px; color: #898781;">app tile</span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; background: #0d0d0d; border-radius: 12px; padding: 18px 20px;">
    <svg width="26" height="26" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="color: #ffffff;">
      <path d="M12 48 L36 24 L60 48"/>
      <path d="M22 20 L36 8 L50 20" stroke-width="7" opacity="0.4"/>
    </svg>
    <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.03em; color: #ffffff;">AscendDV</span>
    <span style="margin-left: auto; font-size: 11px; color: #898781;">on dark</span>
  </div>

</div>
</x-dc>
</body>
</html>
